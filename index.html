أولاً: مرتبة التلاوة (martaba) — اختر واحدة:
- «تحقيق»: تأنٍّ تام مع إشباع المدود وتوفية الغنن وإخراج كل حرف من مخرجه.
- «تدوير»: سرعة متوسطة مع المحافظة على الأحكام.
- «حدر»: إسراع مع المحافظة على الأحكام (المد اللازم كاملاً، الغنة، القلقلة).
- «هذّ»: إفراط في السرعة يُسقط الأحكام (قصر ما يجب مده، ترك الغنة والقلقلة، دمج الحروف). وهو حال أغلب من لم يتعلم التجويد.

ثانياً: مستوى التجويد (tajweedLevel): «متقن» أو «جيد» أو «مبتدئ» أو «بدون تجويد»، مع السبب.

ثالثاً: الرواية الأقرب (riwayah) من مواضع الفرش التالية تحديداً — وإن لم تتضح فاختر «غير محددة»:
1. «مالك/ملك يوم الدين»: بالألف «مالك» = عاصم (حفص وشعبة) والكسائي (أبو الحارث والدوري). بلا ألف «ملك» = الباقون.
2. «الصراط» و«صراط»: بالصاد = الجمهور. بالسين «السراط» = قنبل. بإشمام الصاد صوت الزاي في الموضعين = خلف عن حمزة، وفي «اهدنا الصراط» فقط = خلاد.
3. «عليهم» (موضعان): «عليهِمْ» = الجمهور. «عليهُمْ» بضم الهاء = حمزة (خلف وخلاد). «عليهِمُو» بصلة الميم = ابن كثير (البزي وقنبل)، وقالون بخلف.
4. «كفوًا أحد»: «كُفُوًا» بالواو = حفص وحده. «كُفْؤًا» بإسكان الفاء مع الهمز = حمزة. «كُفُؤًا» بضم الفاء مع الهمز = الباقون ومنهم شعبة.
5. عند وصل «الرحيم» بـ«ملك»: إدغام الميم في الميم (الرحيمّلك) = السوسي.
من لم يدرس القراءات يقرأ عادة بما تعلّمه من المصحف (غالباً حفص)؛ فالرواية هنا تُعرف من هذه الكلمات لا من الأصول، ولا تنسب له أصول رواية لم تسمعها.

نقاط الفحص (checkpoints) — املأ ما سمعته منها فعلاً، كل نقطة بتصنيفها:
- [رواية] المواضع الخمسة أعلاه.
- [مد] المد العارض للسكون عند الوقف على «العالمين، الرحيم، الدين، نستعين، المستقيم» (٢ أو ٤ أو ٦ حركات مع ثبات المقدار)، والمد اللازم في «الضالين» (٦ حركات)، والمد الطبيعي (حركتان دون زيادة أو بتر).
- [قلقلة] «أحد» (مرتان) و«الصمد» و«يولد» عند الوقف قلقلة كبرى، و«يلد» عند الوصل صغرى.
- [غنة وإدغام] «ولم يكن له» إدغام النون في اللام بلا غنة، ووصل «أحدٌ * الله» بكسر التنوين «أحدُنِ ٱللهُ» إن وصل.
- [تفخيم وترقيق] لام لفظ الجلالة: مرققة في «بسمِ الله» و«الحمدُ لِله»، مفخمة في «هو اللهُ» و«اللهُ الصمد». الراء: مفخمة في «الرَّحمن»، مرققة في «الصِّراط» و«غيرِ».
- [مخارج] الضاد في «المغضوب» و«الضالين»، والحاء في «الحمد» و«الرحيم»، والعين في «نعبد» و«نستعين»، والصاد في «الصراط» و«الصمد».
- [وقف ووصل] الوقف على رؤوس الآي أو الوصل، وعدم الوقف القبيح.
